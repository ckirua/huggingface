# Wishlist for `hf-archive archive-all`.
#
# Target ceiling: RTX 2070 (8GB) → single 3090 (24GB) → 2x3090 (~48GB).
# llama.cpp multi-GPU is layer-split (not a true NVLink pool); archive by
# total VRAM budget. 2x3090 is the MAX desired level — every considered-good
# official instruct GGUF that can load usefully in this range is listed.
# Not GGUF-only: 3090-fit image/Gemlite (diffusers/HQQ) sidecars are in-scope
# when they beat llama.cpp for that stack. Skip unpacked BF16, MLX, Spaces,
# and widely mirrored parents (e.g. FLUX.2-klein-4B).
#
# archive-all walks this file in order. Wave 0 is the already-started seed
# list (keep first). New waves are cheaper/smaller first so overnight
# sessions make progress; largest new 70–80B-class dumps are last.
#
# Quant selection is intentional — NOT a full bartowski multi-quant dump.
# YAML anchors (q14 / q32 / q70 / qembed / vl14 / vl32 / vl70 / gemma27 /
# vl_gemma27 / q70tight / scout) keep patterns DRY. PyYAML safe_load
# resolves aliases; load_wishlist only reads the `models:` list.
#
# Size-class pattern policy:
#   ≤14B GGUF     : Q4_K_M / Q5_K_M / Q6_K.gguf  (bartowski Q6_K has no
#                    Q6_K_M; .gguf suffix avoids Q6_K_L)
#   ~24–35B / MoE ~30B-total-A3B : Q3_K_M / Q4_K_M / Q5_K_M
#   ~70–80B dense or 80B-class MoE : Q3_K_M / IQ3_M / Q4_K_M
#   Gemma 27B/31B : Q4_K_M / Q5_K_M only (Q6 too tight on 24GB)
#   Embed         : Q8_0 / f16  (or official GGUF quants in repo if small)
#   Whisper / tiny utility / image-Gemlite sidecar : full small repo if
#                    not a multi-quant dump (no allow_patterns)
#   VL repos      : ALWAYS also *mmproj* (projectors)
#
# SKIP (too big for 2x3090 even at Q3/IQ3, or not usefully loadable):
#   - Kimi-K2 ~1T
#   - DeepSeek-V3 / R1 671B
#   - Qwen3-Coder-480B-A35B
#   - Qwen3-235B-A22B
#   - Qwen3.5-122B / 397B
#   - gpt-oss-120b
#   - Mistral-Large-675B / Mistral-Small-4-119B / Devstral-2-123B
#   - Llama 4 Maverick
#   - GLM-4.5 / 4.6 / 4.7 full dense/MoE (not Flash)
#   - GLM-4.5-Air : Q3_K_M ~51.7GB / Q4 ~68GB — over 48GB even at Q3
#   - Qwen3.8-Flash-Next : Q3_K_M ~85.6GB / Q4 ~111GB — skip
#   - Command-A 111B
#   - c4ai-command-r-plus-08-2024 (~104B; Q3 ~47.5GB leaves no KV room)
#   - Mixtral-8x22B if Q4 >48GB
# Also skipped: abliterated / heretic / Fallen / RP / NSFW finetunes;
# EXL2 repos; dual unsloth dumps when a bartowski GGUF already exists.
#
# Tiny test repo (hf-internal-testing/tiny-random-gpt2) is left out on
# purpose; it remains in S3 from earlier VERIFY runs.

